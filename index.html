<style>
:root {
  --sea-deep:  #003B5C;
  --sea:       #005F87;
  --turquoise: #00A8B5;
  --palm:      #02753F;
  --palm-deep: #014D29;
  --sunshine:  #FFB700;
  --sunshine-warm: #C56E08;
  --coral:     #C8102E;
  --coral-deep:#8B0A1F;
  --hibiscus:  #B0185E;
  --ink:       #0A0E1A;
  --ink-2:     #2C3E50;
  --sand:      #FFF8E7;
  --surface:   #F5FBFC;
  --paper:     #FFFFFF;
  --rule:      #1F2937;
  --rule-soft: #94A3B8;
  --focus:     #FFB700;
}

html, body, #root { background-color: var(--surface); }

body {
  font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.font-display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
.font-body { font-family: 'Inter', system-ui, sans-serif; }
.font-mono-soft { font-family: 'JetBrains Mono', ui-monospace, monospace; }

.caribbean-paper {
  background-color: var(--surface);
  background-image:
    radial-gradient(1200px 280px at 80% -150px, rgba(0,168,181,0.18), transparent 60%),
    radial-gradient(900px 240px at 10% -120px, rgba(0,95,135,0.18), transparent 60%),
    radial-gradient(600px 600px at 95% 100%, rgba(255,183,0,0.08), transparent 60%);
}

.field-input {
  background-color: var(--paper);
  border: 2px solid var(--rule);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  border-radius: 6px;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.field-input::placeholder { color: #6B7280; opacity: 1; }
.field-input:hover { border-color: var(--sea-deep); }
.field-input:focus-visible {
  outline: none;
  border-color: var(--sea-deep);
  box-shadow: 0 0 0 4px var(--focus);
}

.btn-primary {
  background-color: var(--sea-deep);
  color: #FFFFFF;
  border: 2px solid var(--sea-deep);
  font-weight: 600;
  border-radius: 6px;
  transition: background-color 150ms ease, transform 80ms ease, box-shadow 150ms ease;
}
.btn-primary:hover { background-color: var(--palm-deep); border-color: var(--palm-deep); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-ghost {
  background-color: var(--paper);
  color: var(--ink);
  border: 2px solid var(--rule);
  font-weight: 600;
  border-radius: 6px;
  transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease;
}
.btn-ghost:hover { border-color: var(--sea-deep); color: var(--sea-deep); background-color: var(--sand); }
.btn-ghost:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus); border-color: var(--sea-deep); }

.scale-radio {
  appearance: none;
  -webkit-appearance: none;
  width: 38px; height: 38px;
  border: 2px solid var(--rule);
  border-radius: 8px;
  background: var(--paper);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 150ms ease;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.scale-radio:hover { border-color: var(--sea-deep); }
.scale-radio:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
.scale-radio[data-selected="true"] {
  background: var(--sea-deep);
  border-color: var(--sea-deep);
  color: #fff;
}

.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border: 2px solid var(--rule);
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  background-color: var(--paper);
}

.divider-rule {
  height: 3px;
  background: linear-gradient(to right, var(--sea-deep) 0%, var(--turquoise) 33%, var(--sunshine) 66%, var(--coral) 100%);
  border-radius: 2px;
}

.score-arc { transition: stroke-dashoffset 700ms cubic-bezier(.2,.8,.2,1); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 380ms cubic-bezier(.2,.8,.2,1) both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;

  color: #FFFFFF;

  border-radius: 6px;

.option-card { transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease; }
.option-card:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus); }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }

  pre { white-space: pre-wrap; word-wrap: break-word; }

@media (prefers-contrast: more) {
  .field-input { border-width: 3px; }
  .btn-ghost { border-width: 3px; }
  .btn-primary { border-width: 3px; }
}

function Icon({ name, size = 18, strokeWidth = 2, style, className, title }) {
  const path = ICON_PATHS[name] || ICON_PATHS.Circle;
  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"

      className={className}

    >

/* ==================================================================
   Static framework definitions (from the workshop book)
   ================================================================== */
const STRATEGIC_OPTIONS = [
  { id: "buy",     label: "Buy",     blurb: "Purchase a vendor capability and integrate. MIT NANDA evidence: buying outperforms building." },
  { id: "partner", label: "Partner", blurb: "Co-develop with a vendor or specialist. Suits regulated/sensitive workflows where pure SaaS is insufficient." },
  { id: "build",   label: "Build",   blurb: "Internal engineering of a custom AI capability. The slowest, most expensive path; reserve for genuine moats." },
];

const CALF_FIELDS = [
  { k: "capacity",  label: "Capacity",  hint: "Sufficient infrastructure, time, and budget to adopt AI without rushing." },
  { k: "adoption",  label: "Adoption",  hint: "A defined adoption plan: each tool paired with use-case, owner, and sunset condition." },
  { k: "literacy",  label: "Literacy",  hint: "Baseline AI literacy across the workforce, calibrated to role." },
  { k: "fluency",   label: "Fluency",   hint: "Confident, judgement-bearing AI use among those leading adoption." },
];

const SECAS_FIELDS = [
  { k: "strategy",        label: "Strategy",        hint: "AI named in the strategic plan with measurable outcomes." },
  { k: "ethics",          label: "Ethics",          hint: "Explicit ethics framework — equity, privacy, accountability — governs AI use." },
  { k: "capability",      label: "Capability",      hint: "Continuing investment in workforce capability, treated as recurrent — not one-off." },
  { k: "accountability",  label: "Accountability",  hint: "Named individuals accountable for AI outcomes at every level." },
  { k: "sustainability",  label: "Sustainability",  hint: "AI deployment is environmentally, financially, and culturally sustainable long-term." },
];

const WHEEL_DOMAINS = [
  { k: "strategy",      label: "Strategy alignment",        hint: "The connection between AI use and the organisation's mission. The test any new AI tool must pass." },
  { k: "data",          label: "Data governance",           hint: "Rules under which data is collected, stored, processed, transferred, deleted; residency; cross-border transfer." },
  { k: "procurement",   label: "Procurement & vendor",      hint: "Standards a vendor must meet; contractual protections; conditions for ending the relationship." },
  { k: "workforce",     label: "Workforce capability",      hint: "Literacy, fluency, and sovereignty competencies required by role; training infrastructure." },
  { k: "output",        label: "Output assurance",          hint: "Application of frameworks like ACRE before release, embedded in workflow." },
  { k: "equity",        label: "Equity & inclusion",        hint: "Explicit commitment that AI deployment will not entrench, and where possible reduce, existing inequities." },
  { k: "risk",          label: "Risk & incident response",  hint: "Protocols for identifying, escalating, and responding to AI-related incidents." },
  { k: "public",        label: "Public accountability",     hint: "Public-facing commitments, named owners, and channels by which stakeholders can raise concerns." },
];

const STEPS = [
  { id: 0, title: "Setup",       icon: "Briefcase" },
  { id: 1, title: "Strategy",    icon: "Compass" },
  { id: 2, title: "CARE",        icon: "Target" },
  { id: 3, title: "CRAFT",       icon: "Layers" },
  { id: 4, title: "ACRE",        icon: "Eye" },
  { id: 5, title: "CALF/SECAS",  icon: "Settings" },
  { id: 6, title: "Governance",  icon: "ShieldCheck" },
  { id: 7, title: "Diagnostic",  icon: "FileText" },
];

const initialData = () => ({
  setup: {
    org: "", sector: "", size: "", role: "", initiative: "",
    maturity: "", spend: ""
  },
  strategy: {
    posture: "", soverData: 3, soverDecisions: 3, soverValues: 3,
    pAndLTarget: ""
  },
  care: {
    consider: "", analyse: "", reflect: "", evaluate: ""
  },
  craft: {
    context: "", role: "", action: "", format: "", threshold: ""
  },
  acre: {
    accuracy: "", completeness: "", relevance: "", equity: ""
  },
  calf: { capacity: 3, adoption: 3, literacy: 3, fluency: 3 },
  secas: { strategy: 3, ethics: 3, capability: 3, accountability: 3, sustainability: 3 },
  wheel: {
    strategy: 3, data: 3, procurement: 3, workforce: 3,
    output: 3, equity: 3, risk: 3, public: 3
  }
});

/* ==================================================================
   Diagnostic logic
   ================================================================== */
function wordCount(s) { if (!s) return 0; return s.trim().split(/\s+/).filter(Boolean).length; }

function computeDiagnostic(d) {
  const flags = [];
  const strengths = [];
  let score = 0;

  // Setup completeness (max 5)
  const setupFilled = Object.values(d.setup).filter(v => v && String(v).trim()).length;
  score += Math.min(5, setupFilled * 0.7);

  // Strategic frame (max 12)
  if (d.strategy.posture) {
    score += 3;
    if (d.strategy.posture === "buy") strengths.push("Strategic posture is Buy — aligned with MIT NANDA's evidence that purchased AI outperforms in-house builds.");
    if (d.strategy.posture === "build") flags.push({ level: "soft", text: "Build is the path of last resort. MIT NANDA found purchased solutions outperform in-house builds 2:1 on measurable P&L impact. Defend the build decision against a defensible buy alternative." });
  } else {
    flags.push({ level: "hard", text: "No Buy/Partner/Build posture chosen. The first executive call on any AI capability is which path; not making it explicitly is the most common failure mode in the GenAI Divide." });
  }
  const sov = (d.strategy.soverData + d.strategy.soverDecisions + d.strategy.soverValues);
  score += Math.round(sov / 15 * 6); // 6 points for sovereignty (3-15 → 1-6)
  if (sov >= 12) strengths.push("Sovereign AI principles (data, decisions, values) are deliberately addressed.");
  if (sov < 7) flags.push({ level: "hard", text: "Sovereign AI principles are weak across data, decisions, and values. AI deployed without sovereignty becomes a procurement liability." });
  if (d.strategy.pAndLTarget && wordCount(d.strategy.pAndLTarget) >= 4) {
    score += 3;
    strengths.push("A measurable P&L target is named — distinguishes you from the 95% of pilots without one.");
  } else {
    flags.push({ level: "hard", text: "No measurable P&L target. MIT NANDA's 95% failure rate is overwhelmingly pilots that never named the financial outcome they were chasing." });
  }

  // CARE (max 12)
  const careKeys = ["consider","analyse","reflect","evaluate"];
  let careFilled = 0;
  careKeys.forEach(k => { if (d.care[k] && wordCount(d.care[k]) >= 4) careFilled += 1; });
  score += careFilled * 3;
  if (careFilled === 4) strengths.push("CARE strategic decision frame is fully completed.");
  if (!d.care.evaluate || wordCount(d.care.evaluate) < 4) {
    flags.push({ level: "hard", text: "CARE Evaluate phase is missing. Without explicit success and kill criteria, the initiative cannot be governed." });
  }

  // CRAFT (max 12)
  const craftKeys = ["context","role","action","format","threshold"];
  let craftFilled = 0;
  craftKeys.forEach(k => { if (d.craft[k] && wordCount(d.craft[k]) >= 4) craftFilled += 1; });
  score += craftFilled * 2.4;
  if (craftFilled === 5) strengths.push("CRAFT prompt architecture is fully specified — minimises hallucination and scope drift.");
  if (d.craft.threshold && /pedagog|learn|board|risk|evidence|justif|equit|p&l|measurable/i.test(d.craft.threshold)) {
    strengths.push("CRAFT threshold names what 'good enough' means — not just task completion.");
  }

  // ACRE (max 12)
  const acreKeys = ["accuracy","completeness","relevance","equity"];
  let acreFilled = 0;
  acreKeys.forEach(k => { if (d.acre[k] && wordCount(d.acre[k]) >= 4) acreFilled += 1; });
  score += acreFilled * 3;
  if (acreFilled === 4) strengths.push("ACRE output assurance dimensions are all addressed.");
  if (!d.acre.equity || wordCount(d.acre.equity) < 4) {
    flags.push({ level: "hard", text: "ACRE Equity is unaddressed. AI without equity governance is a regulatory and reputational liability — and a strategic abdication." });
  }

  // CALF (max 12)
  const calfSum = d.calf.capacity + d.calf.adoption + d.calf.literacy + d.calf.fluency; // 4-20
  score += Math.round(((calfSum - 4) / 16) * 12);
  if (calfSum >= 16) strengths.push("CALF readiness conditions (capacity, adoption, literacy, fluency) are strong.");
  if (calfSum <= 8) flags.push({ level: "hard", text: "CALF readiness is weak — at least one of capacity, adoption, literacy, or fluency is critically underdeveloped. AI adoption will be performative, not sovereign." });

  // SECAS (max 13)
  const secasSum = d.secas.strategy + d.secas.ethics + d.secas.capability + d.secas.accountability + d.secas.sustainability; // 5-25
  score += Math.round(((secasSum - 5) / 20) * 13);
  if (secasSum >= 20) strengths.push("SECAS governance overlay (strategy, ethics, capability, accountability, sustainability) is in place.");
  if (d.secas.accountability <= 2) flags.push({ level: "hard", text: "Named accountability is missing. Without individuals accountable for AI outcomes at every level, governance is theatre." });
  if (d.secas.ethics <= 2) flags.push({ level: "hard", text: "Ethics framework is weak. Equity, privacy, and accountability cannot be added later as a wrapper — they must be designed in." });

  // Governance Wheel (max 22)
  const wheelKeys = Object.keys(d.wheel);
  const wheelSum = wheelKeys.reduce((acc, k) => acc + d.wheel[k], 0); // 8-40
  score += Math.round(((wheelSum - 8) / 32) * 22);
  const wheelStrong = wheelKeys.filter(k => d.wheel[k] >= 4).length;
  const wheelWeak = wheelKeys.filter(k => d.wheel[k] <= 2);
  if (wheelStrong >= 6) strengths.push(`Governance Wheel is strong on ${wheelStrong} of 8 domains.`);
  if (wheelWeak.length >= 3) flags.push({ level: "hard", text: `Governance Wheel has ${wheelWeak.length} domains scoring 2 or below. The Wheel rotates — every weak domain becomes the next incident.` });
  if (d.wheel.public <= 2) flags.push({ level: "soft", text: "Public accountability is weak. Stakeholders need named owners and a channel to raise concerns; opacity becomes a liability." });

  score = Math.max(0, Math.min(100, Math.round(score)));

  let verdict, verdictColor, verdictBg;
  if (score >= 80)      { verdict = "In the Sovereign 5%";              verdictColor = "#014D29"; verdictBg = "#02753F"; }
  else if (score >= 60) { verdict = "Aligned, but drifting";            verdictColor = "#003B5C"; verdictBg = "#005F87"; }
  else if (score >= 40) { verdict = "At Risk of Joining the 95%";       verdictColor = "#9A4A00"; verdictBg = "#C56E08"; }
  else                  { verdict = "On the Wrong Side of the Divide";  verdictColor = "#8B0A1F"; verdictBg = "#C8102E"; }

  return { score, verdict, verdictColor, verdictBg, flags, strengths,
           dimensions: {
             setup: setupFilled, sovereignty: sov, care: careFilled, craft: craftFilled, acre: acreFilled,
             calfSum, secasSum, wheelSum, wheelStrong, wheelWeak: wheelWeak.length
           } };
}

/* ==================================================================
   UI primitives
   ================================================================== */
const FieldLabel = ({ label, hint, required, htmlFor }) => (
  <div className="mb-2">
    <label htmlFor={htmlFor}
      className="font-mono-soft block"
      style={{ fontSize: "12px", letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--ink)", fontWeight: 700 }}>
      {label}
      {required && <span style={{ color: "var(--coral)", marginLeft: "6px" }} aria-label="required">*</span>}

const ScoreDial = ({ score, color }) => {
  const radius = 72;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (score / 100) * circumference;
  return (
    <div className="relative" style={{ width: 184, height: 184 }} role="img"
         aria-label={`Executive AI Readiness score ${score} out of 100`}>
      <svg width="184" height="184" viewBox="0 0 184 184" aria-hidden="true">
        <circle cx="92" cy="92" r={radius} fill="none" stroke="#D1D5DB" strokeWidth="6" />
        <circle cx="92" cy="92" r={radius} fill="none" stroke={color} strokeWidth="6"
          strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset}
          transform="rotate(-90 92 92)" className="score-arc" />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-display" style={{ fontSize: "60px", color: "var(--ink)", fontVariationSettings: '"opsz" 144, "wght" 600', lineHeight: 1, letterSpacing: "-0.04em" }}>{score}</span>
        <span className="font-mono-soft mt-1" style={{ fontSize: "11px", color: "var(--ink-2)", letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700 }}>/ 100</span>
      </div>
    </div>
  );
};

function buildBoardBrief(d, diag) {
  const posture = STRATEGIC_OPTIONS.find(o => o.id === d.strategy.posture)?.label || "[unspecified]";
  const lines = [];
  lines.push(`EXECUTIVE AI READINESS — BOARD BRIEF`);
  lines.push(`Generated ${new Date().toLocaleDateString()}`);
  lines.push(``);
  lines.push(`ORGANISATION:    ${d.setup.org || "[unspecified]"}`);
  lines.push(`SECTOR:          ${d.setup.sector || "[unspecified]"}`);
  lines.push(`SIZE:            ${d.setup.size || "[unspecified]"}`);
  lines.push(`PREPARED BY:     ${d.setup.role || "[unspecified]"}`);
  lines.push(``);
  lines.push(`INITIATIVE UNDER REVIEW`);
  lines.push(`  ${d.setup.initiative || "[unspecified]"}`);
  lines.push(``);
  lines.push(`STRATEGIC POSTURE`);
  lines.push(`  Path:        ${posture}`);
  lines.push(`  P&L target:  ${d.strategy.pAndLTarget || "[unspecified]"}`);
  lines.push(`  Sovereignty: data ${d.strategy.soverData}/5  ·  decisions ${d.strategy.soverDecisions}/5  ·  values ${d.strategy.soverValues}/5`);
  lines.push(``);
  lines.push(`CARE — STRATEGIC DECISION`);
  ["consider","analyse","reflect","evaluate"].forEach(k => { if (d.care[k]) lines.push(`  ${k[0].toUpperCase()+k.slice(1)}: ${d.care[k]}`); });
  lines.push(``);
  lines.push(`CRAFT — AI ARCHITECTURE`);
  ["context","role","action","format","threshold"].forEach(k => { if (d.craft[k]) lines.push(`  ${k[0].toUpperCase()+k.slice(1)}: ${d.craft[k]}`); });
  lines.push(``);
  lines.push(`ACRE — OUTPUT ASSURANCE`);
  ["accuracy","completeness","relevance","equity"].forEach(k => { if (d.acre[k]) lines.push(`  ${k[0].toUpperCase()+k.slice(1)}: ${d.acre[k]}`); });
  lines.push(``);
  lines.push(`CALF / SECAS — READINESS`);
  CALF_FIELDS.forEach(f => lines.push(`  ${f.label.padEnd(14)} ${d.calf[f.k]}/5`));
  SECAS_FIELDS.forEach(f => lines.push(`  ${f.label.padEnd(14)} ${d.secas[f.k]}/5`));
  lines.push(``);
  lines.push(`GOVERNANCE WHEEL`);
  WHEEL_DOMAINS.forEach(w => lines.push(`  ${w.label.padEnd(28)} ${d.wheel[w.k]}/5`));
  lines.push(``);
  lines.push(`EXECUTIVE AI READINESS: ${diag.score}/100 — ${diag.verdict}`);
  lines.push(``);
  if (diag.strengths.length) {
    lines.push(`HOLDING FIRM`);
    diag.strengths.forEach(s => lines.push(`  · ${s}`));
    lines.push(``);
  }
  if (diag.flags.length) {
    lines.push(`WHERE THE LINE SLIPS`);
    diag.flags.forEach(f => lines.push(`  [${f.level === "hard" ? "CRITICAL" : "SOFT"}] ${f.text}`));
    lines.push(``);
  }
  lines.push(`90-DAY ROADMAP — SUGGESTED PRIORITIES`);
  // Generate roadmap based on weakest dimensions
  const priorities = [];
  if (!d.strategy.pAndLTarget || wordCount(d.strategy.pAndLTarget) < 4) priorities.push("Days 0–14: Name the measurable P&L target. Without it, the initiative cannot enter board governance.");
  if (diag.dimensions.calfSum <= 12) priorities.push("Days 0–30: Address CALF foundation — capacity, adoption, literacy, fluency. Pick the one or two weakest.");
  if (d.secas.accountability <= 2) priorities.push("Days 14–30: Name accountable individuals at every level. Publish RACI in board pack.");
  if (d.secas.ethics <= 2) priorities.push("Days 14–45: Draft ethics framework (equity, privacy, accountability). Tabled at Risk Committee.");
  if (diag.dimensions.wheelWeak >= 3) priorities.push("Days 30–60: Strengthen the weakest Governance Wheel domains — they will become incidents otherwise.");
  if (diag.dimensions.acre < 3) priorities.push("Days 30–60: Operationalise ACRE in the workflow. Embed audit, not just policy.");
  if (priorities.length === 0) priorities.push("Days 0–30: Maintain current discipline. Quarterly Wheel review. Re-run this diagnostic in 90 days.");
  priorities.push("Days 60–90: Re-run the Executive AI Readiness Diagnostic with the executive team. Expect a 10-point improvement.");
  priorities.forEach((p, i) => lines.push(`  ${i+1}. ${p}`));
  lines.push(``);
  lines.push(`Diagnostic grounded in the CARE, CRAFT, ACRE, CALF/SECAS, and`);
  lines.push(`Jowallah Governance Wheel frameworks (© Dr. Rohan Jowallah, 2026).`);
  lines.push(`Anchored in the MIT NANDA "GenAI Divide" research and the NIST AI RMF.`);
  lines.push(``);
  lines.push(`— The Executive AI Readiness Diagnostic`);
  lines.push(`  by Dr. Rohan Jowallah · AAC&U Faculty AI Institute Fellow`);
  return lines.join("\n");
}

const StepDiagnostic = ({ data, diagnostic, onReset }) => {
  const { score, verdict, verdictColor, verdictBg, flags, strengths } = diagnostic;
  const [copied, setCopied] = useState(false);
  const briefText = useMemo(() => buildBoardBrief(data, diagnostic), [data, diagnostic]);

  const copyBrief = async () => {
    try { await navigator.clipboard.writeText(briefText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch {}
  };

  return (
    <section className="fade-up">
      <SectionHeading eyebrow="08 — Diagnostic & 90-Day Roadmap"
        title="Where you sit on the GenAI Divide."
        lede="Scored against the patterns that distinguish the 5% extracting material value from the 95% running pilots that go nowhere." />

      <div className="mt-10 p-8 rounded-md flex flex-col md:flex-row items-center md:items-start gap-8"
        style={{ backgroundColor: "var(--paper)", border: `4px solid ${verdictBg}` }}>
        <ScoreDial score={score} color={verdictBg} />
        <div className="flex-1">
          <span className="font-mono-soft" style={{ fontSize: "12px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--ink-2)", fontWeight: 700 }}>
            Executive AI Readiness Verdict
          </span>
          <h3 className="font-display mt-2" style={{ fontSize: "clamp(26px, 4vw, 36px)", color: verdictColor, fontVariationSettings: '"opsz" 144, "wght" 700', letterSpacing: "-0.02em", lineHeight: 1.1 }}>
            {verdict}
          </h3>
          <p className="font-body mt-4" style={{ fontSize: "16.5px", color: "var(--ink)", lineHeight: 1.6 }}>
            {score >= 80 ? "This initiative is governed with the discipline that distinguishes the Sovereign 5% from the GenAI Divide. The board pack writes itself. Hold the line, and re-test in 90 days."
            : score >= 60 ? "The strategic frame and the architecture are sound, but soft spots exist where the initiative could quietly drift toward the 95%. Address the flags below before the next board cycle."
            : score >= 40 ? "Without intervention, this initiative will join the 95% of pilots producing no measurable P&L impact. The diagnostic identifies the binding constraints — start there."
            : "As designed, this initiative sits inside the GenAI Divide. The technology is not the problem. The frame, the architecture, and the readiness conditions all need attention before any further spend."}
          </p>
        </div>
      </div>

      {strengths.length > 0 && (
        <div className="mt-8" role="region" aria-label="Strengths">
          <h4 className="font-mono-soft mb-3" style={{ fontSize: "12px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--palm-deep)", fontWeight: 700 }}>
            Holding firm
          </h4>
          <ul className="space-y-2" style={{ listStyle: "none", padding: 0 }}>
            {strengths.map((s, i) => (
              <li key={i} className="font-body flex gap-3" style={{ fontSize: "15.5px", color: "var(--ink)", lineHeight: 1.55 }}>
                <span aria-hidden="true" style={{ flexShrink: 0, marginTop: 4 }}>
                  <Icon name="CheckCircle2" size={18} style={{ color: "var(--palm)" }} />
                </span>
                <span>{s}</span>
              </li>
            ))}
          </ul>
        </div>
      )}

      {flags.length > 0 && (
        <div className="mt-8" role="region" aria-label="Issues to address">
          <h4 className="font-mono-soft mb-3" style={{ fontSize: "12px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--coral)", fontWeight: 700 }}>
            Where the line slips
          </h4>
          <ul className="space-y-3" style={{ listStyle: "none", padding: 0 }}>
            {flags.map((f, i) => (
              <li key={i} className="p-4 rounded-md flex gap-3"
                style={{ backgroundColor: f.level === "hard" ? "#FFF1F1" : "#FFF9E6",
                         border: `2px solid ${f.level === "hard" ? "var(--coral)" : "var(--sunshine-warm)"}` }}>
                <span aria-hidden="true" style={{ flexShrink: 0, marginTop: 2 }}>
                  <Icon name="AlertTriangle" size={20} style={{ color: f.level === "hard" ? "var(--coral)" : "var(--sunshine-warm)" }} />
                </span>
                <span className="font-body" style={{ fontSize: "15.5px", color: "var(--ink)", lineHeight: 1.55 }}>
                  <strong style={{ textTransform: "uppercase", fontSize: "11px", letterSpacing: "0.1em", color: f.level === "hard" ? "var(--coral)" : "var(--sunshine-warm)", marginRight: 8, fontFamily: "JetBrains Mono, monospace" }}>
                    {f.level === "hard" ? "Critical" : "Soft"}
                  </strong>
                  {f.text}
                </span>
              </li>
            ))}
          </ul>
        </div>
      )}

      <div className="mt-12 divider-rule" role="presentation" />

      <div className="mt-10">
        <span className="font-mono-soft" style={{ fontSize: "12px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--ink-2)", fontWeight: 700 }}>
          Board Brief — composed
        </span>
        <h3 className="font-display mt-3" style={{ fontSize: "clamp(26px, 4vw, 36px)", color: "var(--ink)", fontVariationSettings: '"opsz" 144, "wght" 600' }}>
          {data.setup.org || "Untitled Organisation"}
        </h3>
        <div className="flex flex-wrap gap-2 mt-4">
          {data.setup.sector && <span className="tag-pill">{data.setup.sector}</span>}
          {data.setup.role && <span className="tag-pill">{data.setup.role}</span>}
          {data.strategy.posture && <span className="tag-pill" style={{ borderColor: "var(--sea-deep)", color: "#fff", backgroundColor: "var(--sea-deep)" }}>
            {STRATEGIC_OPTIONS.find(o => o.id === data.strategy.posture)?.label}
          </span>}
        </div>

        <div className="mt-8">
          <pre className="font-body whitespace-pre-wrap p-6 rounded-md"
            style={{ backgroundColor: "var(--paper)", border: "2px solid var(--rule)",
                     fontSize: "14px", lineHeight: 1.65, color: "var(--ink)",
                     fontFamily: "'JetBrains Mono', ui-monospace, monospace" }}
            tabIndex={0} aria-label="Generated board brief text">
            {briefText}
          </pre>
        </div>

        <div className="flex flex-wrap gap-3 mt-6 no-print">
          <button onClick={copyBrief} className="btn-ghost px-5 py-3 flex items-center gap-2" style={{ fontSize: "15px" }} aria-live="polite">
            <Icon name="Copy" size={16} />
            {copied ? "Copied" : "Copy board brief"}
          </button>
          <button onClick={() => window.print()} className="btn-ghost px-5 py-3 flex items-center gap-2" style={{ fontSize: "15px" }}>
            <Icon name="Printer" size={16} />
            Print
          </button>
          <button onClick={onReset} className="btn-ghost px-5 py-3 flex items-center gap-2" style={{ fontSize: "15px" }}>
            <Icon name="RotateCcw" size={16} />
            Reset & re-run
          </button>
        </div>
      </div>
    </section>
  );
};

/* ==================================================================
   Stepper
   ================================================================== */
const Stepper = ({ step, onSelect }) => (
  <nav className="flex flex-wrap gap-2 mb-10 no-print" aria-label="Diagnostic progress">
    {STEPS.map((s, i) => {
      const active = i === step;
      const done = i < step;
      return (
        <button key={s.id} onClick={() => onSelect(i)} aria-current={active ? "step" : undefined}
          className="flex items-center gap-2 px-3 py-2 rounded-md"
          style={{
            backgroundColor: active ? "var(--sea-deep)" : (done ? "var(--sand)" : "var(--paper)"),
            color: active ? "#FFFFFF" : "var(--ink)",
            border: `2px solid ${active ? "var(--sea-deep)" : (done ? "var(--palm)" : "var(--rule-soft)")}`,
            fontWeight: 600 }}>
          <span className="font-mono-soft" style={{ fontSize: "11px", letterSpacing: "0.08em", fontWeight: 700, opacity: active ? 1 : 0.85 }}>
            0{i + 1}
          </span>
          <span className="font-display" style={{ fontSize: "14.5px", fontVariationSettings: '"opsz" 14, "wght" 600' }}>
            {s.title}
          </span>
          {done && <span aria-label="Completed" style={{ marginLeft: 2 }}>
            <Icon name="CheckCircle2" size={14} style={{ color: "var(--palm)" }} />
          </span>}
        </button>
      );
    })}
  </nav>
);

/* ==================================================================
   Root
   ================================================================== */
function ExecutiveAIReadinessDiagnostic() {
  const [step, setStep] = useState(0);

  const updateSection = (section) => (key, value) =>
    setData((d) => ({ ...d, [section]: { ...d[section], [key]: value } }));
  const diagnostic = useMemo(() => computeDiagnostic(data), [data]);
  const reset = () => { setData(initialData()); setStep(0); };

    if (mainRef.current) {
      mainRef.current.focus({ preventScroll: true });
      window.scrollTo({ top: mainRef.current.offsetTop - 24, behavior: "smooth" });
    }
  }, [step]);

  const renderStep = () => {
    switch (step) {
      case 0: return <StepSetup     data={data.setup}    update={updateSection("setup")} />;
      case 1: return <StepStrategy  data={data.strategy} update={updateSection("strategy")} />;
      case 2: return <StepCARE      data={data.care}     update={updateSection("care")} />;

      case 7: return <StepDiagnostic data={data} diagnostic={diagnostic} onReset={reset} />;

            <em style={{ fontStyle: "italic", color: "var(--coral)", fontVariationSettings: '"opsz" 144, "wght" 600' }}>
              Readiness
            </em>{" "}
            Diagnostic
          </h1>

          <p className="font-body mt-7" style={{ fontSize: "18px", lineHeight: 1.65, color: "var(--ink)", maxWidth: "720px" }}>
            <span className="font-display" style={{ float: "left", fontSize: "3.4em", lineHeight: 0.85, margin: "0.05em 0.1em 0 0", color: "var(--sea-deep)", fontVariationSettings: '"opsz" 144, "wght" 700' }}>
              N
            </span>
            inety-five per cent of enterprise AI pilots produce no measurable P&L impact. The
            failure is rarely technical — it is in the strategic frame, the architecture, the
            output assurance, the readiness conditions, and the governance. This diagnostic
            walks you through eight executive decisions, scored against the integrated
            framework that distinguishes the Sovereign 5% from the GenAI Divide.
          </p>

          <div className="mt-8 flex flex-wrap items-center gap-2">
            <span className="tag-pill" style={{ background: "var(--sea-deep)", color: "#FFFFFF", borderColor: "var(--sea-deep)" }}>CARE</span>
            <span className="tag-pill" style={{ background: "var(--coral)", color: "#FFFFFF", borderColor: "var(--coral)" }}>CRAFT</span>
            <span className="tag-pill" style={{ background: "var(--palm)", color: "#FFFFFF", borderColor: "var(--palm)" }}>ACRE</span>
            <span className="tag-pill" style={{ background: "var(--sunshine)", color: "var(--ink)", borderColor: "var(--ink)" }}>CALF / SECAS</span>
            <span className="tag-pill" style={{ background: "var(--hibiscus)", color: "#FFFFFF", borderColor: "var(--hibiscus)" }}>Governance Wheel</span>
          </div>
        </header>

        <div className="divider-rule mb-10" role="presentation" />

        <Stepper step={step} onSelect={setStep} />

        <main id="main-content" ref={mainRef} tabIndex="-1" className="min-h-[420px]" style={{ outline: "none" }}>

            style={{ borderTop: "2px solid var(--rule-soft)" }}>

              <p className="font-body italic" style={{ fontSize: "14px", color: "var(--ink)", lineHeight: 1.55 }}>

              </p>
            </div>
          </div>

          <div className="mt-10 pt-6 flex flex-wrap items-center justify-between gap-3" style={{ borderTop: "1px solid var(--rule-soft)" }}>
            <span className="font-mono-soft" style={{ fontSize: "11.5px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--ink-2)", fontWeight: 700 }}>
              By <span style={{ color: "var(--sea-deep)" }}>Dr. Rohan Jowallah</span> · Workshop Edition · 2026
            </span>
            <span className="font-mono-soft" style={{ fontSize: "11px", letterSpacing: "0.16em", textTransform: "uppercase", color: "var(--ink-2)" }}>
              Caribbean palette · WCAG AA+ · Keyboard-first
            </span>

          <p className="font-body mt-4" style={{ fontSize: "12px", color: "var(--ink-2)", lineHeight: 1.5, maxWidth: "720px" }}>
            CARE, CRAFT, ACRE, CALF/SECAS, and the Jowallah Governance Wheel are the intellectual
            property of Dr. Rohan Jowallah. © 2026. All rights reserved.
          </p>
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ExecutiveAIReadinessDiagnostic />);
  </script>
